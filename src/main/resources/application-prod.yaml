spring:
  # To Connect PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none # 운영때는 none으로 교체, 개발중에는 update, 스키마 구조 변경 방어 validate

    show-sql: false # 실행쿼리를 확인
    properties:
      hibernate:
        format_sql: true # SQL문 가독성
        use_sql_comments: true # SQL 주석 제공

server:
  port: 8082

logging:
  level:
    root: info
    com.discodeit: info